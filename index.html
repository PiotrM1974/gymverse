<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="application-version" content="2.0.3">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GymNastika">
<meta name="theme-color" content="#F4F6F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1420" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preload" href="src/ui/fonts/manrope-latin-variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="src/ui/fonts/manrope-latin-ext-variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="src/features/anatomy/atlas.css">
<title>GymNastika</title>
<style>
:root {
  --bg: #0d0f12;
  --card-bg: #161a1f;
  --card-sub: #1e232b;
  --lime: #ccff00;
  --lime-dim: rgba(204, 255, 0, 0.15);
  --text: #ffffff;
  --text-muted: #8e95a5;
  --border: #28303d;
  --danger: #ff4757;
  --orange: #ff9f43;
  --blue: #38bdf8;
  --radius: 16px;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: Manrope, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
html { color-scheme: dark; }
body { background-color: var(--bg); color: var(--text); padding-bottom: 120px; min-height: 100vh; overflow-x: hidden; }
header {
  padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 12px;
  background: rgba(13, 15, 18, 0.85);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  position: sticky; top: 0; z-index: 100;
  display: flex; justify-content: space-between; align-items: center;
  border-bottom: 1px solid var(--border);
}
.logo { font-size: 1.25rem; font-weight:700; letter-spacing: -0.5px; cursor: pointer; }
.logo span { color: var(--lime); }
.header-actions { display: flex; gap: 8px; }
.btn-icon {
  background: var(--card-sub); border: 1px solid var(--border); color: var(--text);
  padding: 8px 12px; border-radius: 10px; font-size: 0.95rem; font-weight: 600;
  display: inline-flex; align-items: center; gap: 5px; cursor: pointer; min-height: 38px;
}
.btn-icon:active { opacity: 0.7; }
.container { max-width: 500px; margin: 0 auto; padding: 16px; }
.view-section { display: none; }
.view-section.active { display: block; animation: fadeIn 0.25s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
.muted { color: var(--text-muted); }
.small { font-size: 0.8rem; }
.view-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 8px; }

/* PLANY */
.plan-grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-top: 12px; }
.plan-card {
  background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 18px; cursor: pointer; display: flex; justify-content: space-between; align-items: center;
  transition: border-color 0.2s; margin-bottom: 0;
}
.plan-card.next { border-color: var(--lime); }
.plan-card:active { border-color: var(--lime); background: var(--card-sub); }
.plan-card h3 { font-size: 1.15rem; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
.plan-card p { font-size: 0.85rem; color: var(--text-muted); }
.plan-arrow { color: var(--lime); font-size: 1.3rem; }
.badge { background: var(--lime); color: #000; font-size: 0.65rem; font-weight:700; padding: 2px 7px; border-radius: 6px; text-transform: uppercase; letter-spacing: 0.3px; }
.banner { background: var(--lime-dim); border: 1px solid var(--lime); border-radius: var(--radius); padding: 14px; margin-top: 12px; }
.banner.soft { background: var(--card-bg); border-color: var(--blue); }
.banner p { font-size: 0.92rem; margin-bottom: 10px; line-height: 1.4; }
.banner .row { display: flex; gap: 8px; }
.banner .row button { flex: 1; }
.week-strip { margin-top: 12px; background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; font-size: 0.88rem; line-height: 1.5; }
.week-strip b { color: var(--lime); }
.data-box { margin-top: 20px; padding-top: 14px; border-top: 1px solid var(--border); }
.data-box .row { display: flex; gap: 8px; }
.data-box .row button { flex: 1; margin-top: 8px; padding: 12px; font-size: 0.88rem; }
.warn { color: var(--orange); }

/* TRENING */
.progress-bar-container { width: 100%; height: 6px; background: var(--card-sub); border-radius: 3px; margin-bottom: 16px; overflow: hidden; }
.progress-bar { height: 100%; background: var(--lime); width: 0%; transition: width 0.3s; }
.exercise-meta { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 6px; }
.exercise-hero { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 10px; }
.exercise-presentation { padding: 12px 14px 14px; border-bottom: 1px solid var(--border); }
.exercise-presentation[hidden], #legacyExerciseImageBox[hidden] { display: none !important; }
.exercise-presentation__group { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 10px; }
.exercise-presentation__group[hidden] { display: none !important; }
.exercise-presentation__group button { min-height: 38px; border: 1px solid var(--border); border-radius: 999px; padding: 8px 13px; background: var(--card-sub); color: var(--text); font-size: .82rem; font-weight: 700; cursor: pointer; }
.exercise-presentation__group button[aria-pressed="true"] { border-color: #81d9b1; background: #18372e; color: #a7f3d0; }
.exercise-presentation__group button:focus-visible { outline: 2px solid #a7f3d0; outline-offset: 2px; }
.exercise-presentation__figure { width: 100%; aspect-ratio: 3 / 2; margin: 0 auto; overflow: hidden; border: 1px solid var(--border); border-radius: 12px; background: var(--card-sub); }
.exercise-presentation__figure[hidden] { display: none !important; }
.exercise-presentation__figure img { display: block; width: 100%; height: 100%; object-fit: contain; }
.exercise-presentation__caption { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin: 10px 0 0; color: var(--text); font-size: .82rem; line-height: 1.4; }
.exercise-presentation__caption > div { min-width: 0; overflow-wrap: anywhere; }
.exercise-presentation__caption strong { display: block; margin-bottom: 3px; color: var(--accent-text, var(--lime)); font-size: .75rem; letter-spacing: .04em; }
.exercise-presentation__alert { margin: 8px 0 0; color: var(--orange); font-size: .86rem; line-height: 1.45; }
.exercise-presentation__status { margin: 8px 0 0; color: var(--text-muted); font-size: .72rem; text-align: center; }
.exercise-presentation__details { margin-top: 9px; color: var(--text-muted); font-size: .78rem; line-height: 1.45; }
.exercise-presentation__details summary { cursor: pointer; }
.exercise-presentation__details p { margin-top: 6px; }
.training-atlas-disclosure { margin: 0 0 8px; }
.training-atlas-disclosure[hidden] { display: none !important; }
.training-atlas-disclosure > summary { display: flex; align-items: center; min-height: 44px; padding: 0 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--card); color: var(--text); font-size: .88rem; font-weight: 700; cursor: pointer; list-style: none; }
.training-atlas-disclosure > summary::-webkit-details-marker { display: none; }
.training-atlas-disclosure > summary:focus-visible { outline: 2px solid #a7f3d0; outline-offset: 2px; }
.training-atlas-disclosure[open] > summary { margin-bottom: 4px; }
.training-atlas-disclosure:not([open]) [data-atlas-disclosure-close], .training-atlas-disclosure[open] [data-atlas-disclosure-open] { display: none; }
.hero-img-box { width: 100%; height: 280px; background: #090b0e; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid var(--border); padding: 8px; }
.hero-img-box img { width: 100%; height: 100%; object-fit: contain; object-position: center; display: block; }
.hero-title-box { padding: 14px 16px; }
.hero-title-box h2 { font-size: 1.25rem; font-weight: 700; margin-bottom: 4px; line-height: 1.3; }
.swapped-tag { font-size: 0.7rem; font-weight:700; color: #000; background: var(--orange); border-radius: 6px; padding: 2px 6px; vertical-align: middle; margin-left: 6px; }
.hero-target { color: var(--lime); font-size: 0.85rem; font-weight: 600; }
.hero-hint { color: var(--text-muted); font-size: 0.8rem; margin-top: 6px; line-height: 1.35; }
.hero-hint:empty { display: none; }
.hero-warm { color: var(--accent-text); }
.hero-alert { color: var(--orange); font-weight: 600; }
.link-row { display: flex; justify-content: space-between; margin-bottom: 4px; }
.rest-row, .rir-row { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; font-size: 0.8rem; color: var(--text-muted); }
.rp { background: var(--card-sub); border: 1px solid var(--border); color: var(--text-muted); border-radius: 8px; padding: 6px 9px; font-size: 0.8rem; font-weight: 600; cursor: pointer; min-height: 32px; }
.rp.active { background: var(--lime-dim); border-color: var(--lime); color: var(--lime); }
.rp.danger { color: var(--danger); }
.rp:disabled { opacity: 0.35; cursor: not-allowed; }
#swapBox { margin-bottom: 8px; }
#swapBox[hidden], #platesBox[hidden], #peCustom[hidden] { display: none; }

.sets-table { width: 100%; border-collapse: separate; border-spacing: 0 8px; margin-bottom: 4px; }
.sets-table th { font-size: 0.72rem; color: var(--text-muted); text-transform: uppercase; padding: 0 4px 4px; font-weight: 600; text-align: center; }
.sets-table th:first-child { text-align: left; }
.set-row { background: var(--card-bg); }
.set-row td { padding: 10px 4px; text-align: center; vertical-align: middle; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
.set-row td:first-child { border-left: 1px solid var(--border); border-radius: 12px 0 0 12px; font-weight: 700; font-size: 0.9rem; text-align: left; padding-left: 12px; }
.set-row td:last-child { border-right: 1px solid var(--border); border-radius: 0 12px 12px 0; padding-right: 8px; }
.prev-val { font-size: 0.78rem; color: var(--text-muted); white-space: nowrap; cursor: pointer; }
.input-cell { background: var(--card-sub); border: 1px solid var(--border); color: var(--text); width: 64px; height: 40px; border-radius: 8px; text-align: center; font-size: 1rem; font-weight: 600; }
.input-cell:focus { border-color: var(--lime); outline: none; }
.input-cell:disabled { opacity: 0.6; }
.btn-done { background: var(--card-sub); color: #555e6d; border: 1px solid var(--border); border-radius: 8px; padding: 9px 10px; font-weight: 700; font-size: 0.82rem; cursor: not-allowed; transition: all 0.2s; min-width: 74px; }
.btn-done.ready { background: var(--lime-dim); border-color: var(--lime); color: var(--lime); cursor: pointer; }
.btn-done.completed { background: var(--lime); color: #000; border-color: var(--lime); cursor: pointer; }
.step-strip { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 8px; }
.step-strip .rp { flex: 1; min-width: 52px; padding: 9px 4px; }
.plates-box { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; font-size: 0.85rem; line-height: 1.5; }
.plates-box .bars { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; color: var(--text-muted); }
.set-ctrl { display: flex; gap: 8px; margin-bottom: 12px; }
.set-ctrl .btn-secondary { margin-top: 0; padding: 10px; font-size: 0.85rem; }
.set-ctrl .btn-secondary:disabled { opacity: 0.35; }

.nav-row { display: flex; gap: 10px; margin-top: 4px; }
.nav-row .btn-primary, .nav-row .btn-secondary { margin-top: 0; }
.nav-row .btn-prev { flex: 0 0 64px; }
.btn-primary { width: 100%; background: var(--lime); color: #000; border: none; padding: 16px; border-radius: var(--radius); font-size: 1.05rem; font-weight:700; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; }
.btn-primary:active { opacity: 0.85; transform: scale(0.99); }
.btn-secondary { width: 100%; background: var(--card-sub); color: var(--text); border: 1px solid var(--border); padding: 14px; border-radius: var(--radius); font-size: 0.95rem; font-weight: 600; margin-top: 10px; cursor: pointer; }
.btn-secondary:disabled { opacity: 0.35; cursor: not-allowed; }
.btn-link { background: none; border: none; color: var(--text-muted); font-size: 0.85rem; font-weight: 600; padding: 10px 4px; cursor: pointer; text-decoration: underline; }
.btn-link.danger { color: var(--danger); }

/* TIMER */
.bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(22, 26, 31, 0.95); border-top: 1px solid var(--border); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 99; display: flex; justify-content: space-between; align-items: center; max-width: 500px; margin: 0 auto; }
.bottom-bar.flash { animation: flash 0.6s ease 4; }
@keyframes flash { 50% { background: rgba(204,255,0,0.35); } }
.timer-digits { font-size: 1.6rem; font-weight:700; font-variant-numeric: tabular-nums; color: var(--lime); }
.timer-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; }
.timer-ctrls { display: flex; gap: 6px; }
.btn-timer { background: var(--card-sub); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 8px 11px; font-size: 0.85rem; font-weight: 600; cursor: pointer; }

/* PODSUMOWANIE I STATYSTYKI */
.stat-cards { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin: 16px 0; }
.stat-cards.c2 { grid-template-columns: 1fr 1fr; }
.stat-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 6px; text-align: center; }
.stat-card .val { font-size: 1.25rem; font-weight:700; color: var(--lime); margin-bottom: 2px; }
.stat-card .lbl { font-size: 0.68rem; color: var(--text-muted); text-transform: uppercase; padding: 0 4px; }
.humor-card { background: linear-gradient(145deg, #161a1f, #1b2416); border: 1px solid var(--lime); border-radius: var(--radius); padding: 18px; margin: 16px 0; text-align: center; }
.humor-card h4 { color: var(--lime); font-size: 0.9rem; text-transform: uppercase; margin-bottom: 8px; }
.humor-card p { font-size: 1.05rem; font-weight: 600; line-height: 1.4; }
.records { background: var(--card-bg); border: 1px solid var(--lime); border-radius: var(--radius); padding: 14px 16px; margin: 12px 0; }
.records h4 { color: var(--lime); font-size: 0.9rem; margin-bottom: 6px; }
.records li { font-size: 0.9rem; margin-left: 18px; line-height: 1.5; }
.compare-box { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 16px; margin: 12px 0; font-size: 0.92rem; line-height: 1.5; }
.compare-box .up { color: var(--lime); font-weight: 700; }
.compare-box .down { color: var(--orange); font-weight: 700; }
.compare-box button { margin-top: 8px; padding: 10px; font-size: 0.88rem; }

.filter-pills { display: flex; gap: 8px; margin: 12px 0 16px; }
.pill { flex: 1; padding: 9px 4px; border-radius: 8px; background: var(--card-sub); border: 1px solid var(--border); color: var(--text-muted); font-size: 0.82rem; font-weight: 600; text-align: center; cursor: pointer; }
.pill.active { background: var(--lime); color: #000; border-color: var(--lime); }
select.select-custom, input.select-custom { width: 100%; background: var(--card-sub); color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 12px; font-size: 1rem; margin-bottom: 8px; }
.chart-container { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 16px; }
.chart-container h4 { font-size: 0.85rem; color: var(--text-muted); font-weight: 600; margin-bottom: 8px; }
.chart-container canvas { display: block; width: 100%; }

.cal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.cal-head b { text-transform: capitalize; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
.cal-dow { font-size: 0.68rem; color: var(--text-muted); padding-bottom: 2px; }
.cal-day { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 0.82rem; border-radius: 50%; color: var(--text-muted); }
.cal-day[data-act] { cursor: pointer; }
.cal-day.trained { background: var(--lime); color: #000; font-weight:700; }
.cal-day.today { outline: 1.5px solid var(--text-muted); }
.gbar { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 0.85rem; }
.gbar span { width: 64px; color: var(--text-muted); }
.gbar .gtrack { flex: 1; height: 12px; background: var(--card-sub); border-radius: 6px; overflow: hidden; position: relative; }
.gbar .gfill { height: 100%; background: var(--lime); border-radius: 6px; }
.gbar .gfill.low { background: var(--orange); }
.gbar .gfill.high { background: var(--blue); }
.gbar .gmark { position: absolute; top: 0; bottom: 0; width: 2px; background: rgba(255,255,255,0.55); }
.gbar b { width: 24px; text-align: right; }
.rec-row { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 0.85rem; }
.rec-row:last-child { border-bottom: none; }
.rec-row .n { flex: 1; }
.rec-row .v { text-align: right; color: var(--lime); font-weight: 600; white-space: nowrap; }
.rec-row .v small { display: block; color: var(--text-muted); font-weight: 400; }
.body-row { display: flex; gap: 8px; margin-bottom: 10px; }
.body-row input { flex: 1; min-width: 0; background: var(--card-sub); border: 1px solid var(--border); color: var(--text); border-radius: 10px; padding: 10px 12px; font-size: 1rem; }
.body-row button { flex: 0 0 auto; padding: 10px 14px; margin-top: 0; width: auto; }

.hist-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 10px; overflow: hidden; }
.hist-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; cursor: pointer; gap: 10px; }
.hist-stats { font-size: 0.82rem; color: var(--lime); text-align: right; font-weight: 600; }
.hist-body { padding: 0 16px 12px; border-top: 1px solid var(--border); }
.hist-body[hidden] { display: none; }
.hist-ex { padding: 8px 0; font-size: 0.88rem; border-bottom: 1px solid var(--border); }
.hist-ex:last-of-type { border-bottom: none; }
.hist-ex b { display: block; margin-bottom: 4px; font-weight: 600; }
.hist-ex.missing b { color: var(--text-muted); font-weight: 500; }
.set-chip { display: inline-block; background: var(--card-sub); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 6px 9px; margin: 0 4px 4px 0; font-size: 0.82rem; font-weight: 600; cursor: pointer; }
.set-chip.add { color: var(--lime); border-style: dashed; }
.hist-ex small { color: var(--text-muted); }

/* EDYTOR PLANÓW */
.pe-ex { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 8px; }
.pe-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 8px; }
.pe-name { font-size: 0.92rem; font-weight: 600; line-height: 1.3; }
.pe-name small { display: block; color: var(--text-muted); font-weight: 400; font-size: 0.75rem; }
.pe-btns { display: flex; gap: 4px; flex: 0 0 auto; }
.pe-bot { display: flex; align-items: center; gap: 8px; font-size: 0.82rem; color: var(--text-muted); }
.pe-bot b { color: var(--text); min-width: 18px; text-align: center; }
.pe-target { width: 80px; background: var(--card-sub); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 7px; text-align: center; font-size: 0.95rem; }
.pe-title { font-size: 1.1rem; font-weight: 700; }
.pe-check { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; margin-bottom: 8px; }

#toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 70px); transform: translateX(-50%); background: var(--card-sub); border: 1px solid var(--lime); color: var(--text); padding: 10px 16px; border-radius: 12px; font-size: 0.9rem; font-weight: 600; z-index: 200; max-width: 90%; text-align: center; opacity: 0; pointer-events: none; transition: opacity 0.25s; }
#toast.show { opacity: 1; }
/* GymNastika 2.0 — zatwierdzony system Signal */
:root{color-scheme:light;--bg:#F4F6F8;--card-bg:#fff;--card-sub:#EDF1F5;--lime:#0647D8;--lime-dim:#DEE7FF;--text:#17212B;--text-muted:#4F6270;--border:#D7E0E6;--danger:#B42318;--orange:#AA3E00;--blue:#0647D8;--radius:20px;--push:#AA3E00;--push-soft:#FFE5D8;--pull:#00666B;--pull-soft:#D9F5F5}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0D1420;--card-bg:#1C2A3A;--card-sub:#24364A;--lime:#76A0FF;--lime-dim:#293E69;--text:#F6F8FB;--text-muted:#B0C0D0;--border:#374B5D;--danger:#FF938B;--orange:#FF7A32;--blue:#76A0FF;--push:#FF7A32;--push-soft:#503020;--pull:#35D6D0;--pull-soft:#1D494A}}
